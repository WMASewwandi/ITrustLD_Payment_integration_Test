<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iTrustLD Payment Gateway Test</title>
  <style>
    :root { color-scheme: dark; }
    body { font-family: Segoe UI, system-ui, sans-serif; background: #0b1020; color: #e8ecf7; margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p.sub { color: #9aa3b8; margin: 0 0 24px; }
    section { background: #141a2e; border: 1px solid #2a3354; border-radius: 16px; padding: 18px; margin-bottom: 16px; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    h3 { margin: 0 0 8px; font-size: 0.95rem; color: #c9d0e3; }
    label { display: block; font-size: 12px; color: #9aa3b8; margin: 10px 0 4px; }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid #3a456c;
      background: #0b1020;
      color: #fff;
      padding: 9px 10px;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    textarea { min-height: 180px; resize: vertical; }
    button { margin-top: 10px; border: 0; border-radius: 10px; background: #0d9f1b; color: #fff; font-weight: 700; padding: 9px 14px; cursor: pointer; }
    pre {
      background: #0b1020;
      border: 1px solid #2a3354;
      border-radius: 10px;
      padding: 12px;
      overflow: auto;
      font-size: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
      min-height: 48px;
    }
    .path { font-size: 13px; color: #7ee08a; margin-bottom: 8px; }
    .muted { color: #9aa3b8; font-size: 13px; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .api { min-width: 0; }
    @media (max-width: 800px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>iTrustLD payment gateway</h1>
    <p class="sub">One card per method. Edit the JSON payload, then call deposit and/or withdrawal.</p>

    <section id="returnBox" hidden>
      <h2>Returned from iTrustLD</h2>
      <pre id="returnOut">{}</pre>
    </section>

    <section>
      <h2>API credentials</h2>
      <label>API base</label>
      <input id="apiBase" value="https://api.itrustld.com/api/v1" />
      <!-- <input id="apiBase" value="http://localhost:4000/api/v1" /> -->
      <label>X-API-Key</label>
      <input id="apiKey" value="itrustld_partner_dev_key" />
      <label>X-API-Secret</label>
      <input id="apiSecret" value="itrustld_partner_dev_secret" />
      <button type="button" id="reload">Reload methods</button>
      <p class="muted" id="status">Loading methods…</p>
    </section>

    <div id="methods"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);

    const returned = Object.fromEntries(new URLSearchParams(location.search).entries());
    if (Object.keys(returned).length) {
      $("returnBox").hidden = false;
      $("returnOut").textContent = JSON.stringify(returned, null, 2);
    }

    function headers() {
      return {
        "Content-Type": "application/json",
        "X-API-Key": $("apiKey").value.trim(),
        "X-API-Secret": $("apiSecret").value.trim(),
      };
    }

    function base() {
      return $("apiBase").value.replace(/\/$/, "");
    }

    async function api(path, options = {}) {
      const res = await fetch(base() + path, {
        ...options,
        headers: { ...headers(), ...(options.headers || {}) },
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || "Request failed " + res.status);
      return data;
    }

    function samplePlatformId(methodName) {
      const name = String(methodName || "").trim().toLowerCase();
      if (name === "xm") return "12345678";
      if (name === "skrill") return "customer@skrill.com";
      if (name === "neteller") return "customer@neteller.com";
      if (name === "binance" || name === "crypto") return "customer@binance.com";
      if (name === "perfect money") return "U12345678";
      return "12345678";
    }

    function sampleAmount(method) {
      const min = Number(method?.minimum_limit);
      const max = Number(method?.maximum_limit);
      if (Number.isFinite(min) && Number.isFinite(max) && min > 0) {
        if (50 >= min && 50 <= max) return 50;
        return min;
      }
      return 50;
    }

    function sampleDeposit(method) {
      return {
        return_url: "https://i-trust-ld-payment-integration-test.vercel.app/",
        email: "customer@example.com",
        topup_method_id: Number(method.id),
        platform_id: samplePlatformId(method.name),
        currency: "USD",
        amount: sampleAmount(method),
      };
    }

    function sampleWithdrawal(method) {
      return {
        return_url: "https://i-trust-ld-payment-integration-test.vercel.app/",
        email: "customer@example.com",
        cashout_method_id: Number(method.id),
        platform_id: samplePlatformId(method.name),
        currency: "USD",
        amount: sampleAmount(method),
      };
    }

    function groupByName(catalog) {
      const map = new Map();
      function bucket(name) {
        const key = String(name || "").trim() || "Unknown";
        if (!map.has(key.toLowerCase())) {
          map.set(key.toLowerCase(), { name: key, deposit: null, withdrawal: null });
        }
        return map.get(key.toLowerCase());
      }
      (catalog.topup_methods || []).forEach((method) => {
        bucket(method.name).deposit = method;
      });
      (catalog.cashout_methods || []).forEach((method) => {
        bucket(method.name).withdrawal = method;
      });
      return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
    }

    function rangeLabel(method) {
      const min = Number(method.minimum_limit);
      const max = Number(method.maximum_limit);
      return Number.isFinite(min) && Number.isFinite(max) ? " · USD " + min + " – " + max : "";
    }

    function apiBlock(kind, method) {
      const isDeposit = kind === "deposit";
      const path = isDeposit ? "/partner-pay/deposits" : "/partner-pay/withdrawals";
      const payload = isDeposit ? sampleDeposit(method) : sampleWithdrawal(method);
      const key = (isDeposit ? "d" : "w") + "-" + method.id;
      return `
        <div class="api">
          <h3>${isDeposit ? "Deposit" : "Withdrawal"}${rangeLabel(method)}</h3>
          <div class="path">POST ${base()}${path}</div>
          <textarea id="payload-${key}">${JSON.stringify(payload, null, 2)}</textarea>
          <button type="button" data-kind="${kind}" data-id="${method.id}">Call this API</button>
          <pre id="out-${key}">Waiting…</pre>
        </div>
      `;
    }

    function render(catalog) {
      const groups = groupByName(catalog);
      if (!groups.length) {
        $("methods").innerHTML = "<section><p class='muted'>No methods found.</p></section>";
        return;
      }
      $("methods").innerHTML = groups
        .map((group) => {
          const bits = [];
          if (group.deposit) bits.push(apiBlock("deposit", group.deposit));
          if (group.withdrawal) bits.push(apiBlock("withdrawal", group.withdrawal));
          return `<section><h2>${group.name}</h2><div class="pair">${bits.join("")}</div></section>`;
        })
        .join("");

      $("methods").querySelectorAll("button[data-kind]").forEach((btn) => {
        btn.onclick = () => callApi(btn.dataset.kind, btn.dataset.id);
      });
    }

    async function callApi(kind, methodId) {
      const isDeposit = kind === "deposit";
      const path = isDeposit ? "/partner-pay/deposits" : "/partner-pay/withdrawals";
      const key = (isDeposit ? "d" : "w") + "-" + methodId;
      const out = $("out-" + key);
      out.textContent = "Calling…";
      try {
        const payload = JSON.parse($("payload-" + key).value);
        const data = await api(path, {
          method: "POST",
          body: JSON.stringify(payload),
        });
        out.textContent = JSON.stringify(data, null, 2);
        if (data.login_url) window.open(data.login_url, "_blank");
      } catch (err) {
        out.textContent = err.message;
      }
    }

    async function load() {
      $("status").textContent = "Loading methods…";
      $("methods").innerHTML = "";
      try {
        const catalog = await api("/partner-pay/catalog");
        $("status").textContent = "Edit the payload JSON on each API. Headers: X-API-Key + X-API-Secret.";
        render(catalog);
      } catch (err) {
        $("status").textContent = err.message;
      }
    }

    $("reload").onclick = load;
    load();
  </script>
</body>
</html>
